<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book · Tidepool</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>Tidepool</strong><nav><a href="index.html">Home</a><a href="classes.html">Classes</a><a href="book.html" class="current">Book</a><a href="account.html">Account</a></nav></header>
<main>
<h1>Book a lesson</h1>
<p class="lede">Pick a class, choose a time, and we will email your confirmation.</p>
<form>
<label for="class">Class</label>
<select id="class"><option>Splash (ages 3–5)</option><option>Stroke (ages 6–12)</option><option>Adult beginner</option><option>Private lesson</option></select>
<h2>Saturday, October 3</h2>
<div class="slots"><div class="slot">9:00</div><div class="slot">9:30</div><div class="slot">10:00</div><div class="slot">10:30</div><div class="slot">11:00</div><div class="slot">13:00</div><div class="slot">13:30</div><div class="slot">14:00</div></div>
<label for="name">Swimmer name</label><input id="name" autocomplete="name">
<label for="email">Email for confirmation</label><input id="email" type="email" autocomplete="email">
<button class="button" type="submit">Reserve lesson</button>
</form>
</main>
<footer>Tidepool is a fictional swim school used to demonstrate QA. © 2026</footer>
</body>
</html>
