<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" fill="none" role="img" aria-labelledby="title description">
  <title id="title">From agreed scope to observable proof</title>
  <desc id="description">A conceptual Dogfood workflow: review Vision and Plan, direct Claude Code or Codex, inspect and explicitly save changes, then verify the actual outcome. Feedback stays connected to the work.</desc>
  <rect width="800" height="410" rx="20" fill="#FAFAFB"/>
  <g stroke="#E5E5EA" fill="#FFFFFF">
    <rect x="26" y="28" width="340" height="140" rx="14"/>
    <rect x="434" y="28" width="340" height="140" rx="14"/>
    <rect x="434" y="220" width="340" height="140" rx="14"/>
    <rect x="26" y="220" width="340" height="140" rx="14"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <g fill="#0066CC" font-size="17" font-weight="600">
      <text x="50" y="61">1 · DISCOVERY</text><text x="458" y="61">2 · AGENT BOARD</text>
      <text x="458" y="253">3 · REVIEW</text><text x="50" y="253">4 · EVIDENCE</text>
    </g>
    <g fill="#1D1D1F" font-size="27" font-weight="600" letter-spacing="-.5">
      <text x="50" y="103">Agree on the scope</text><text x="458" y="103">Give your agent work</text>
      <text x="458" y="295">Inspect the changes</text><text x="50" y="295">Verify the outcome</text>
    </g>
    <g fill="#5F5F64" font-size="19">
      <text x="50" y="137">Questions → Vision + Plan</text><text x="458" y="137">Claude Code or Codex</text>
      <text x="458" y="329">Explicit apply + source save</text><text x="50" y="329">Captures, checks and findings</text>
      <text x="400" y="390" text-anchor="middle" font-size="17">Pinned feedback stays connected to the conversation.</text>
    </g>
  </g>
  <g stroke="#A7ABB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M382 98H418M411 91L418 98L411 105"/>
    <path d="M604 184V204M597 197L604 204L611 197"/>
    <path d="M418 290H382M389 283L382 290L389 297"/>
    <path d="M196 204V184M189 191L196 184L203 191"/>
  </g>
</svg>
